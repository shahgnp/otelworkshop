name: observability-workshop

services:
  diagnostics-init:
    image: busybox:1.36.1
    command: ["sh", "-c", "chown 1654:1654 /tmp && chmod 1777 /tmp"]
    volumes:
      - diagnostics:/tmp
    networks: [workshop]

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        # Set LAB=starter, lab1-solution, or lab2-solution before docker compose.
        LAB: ${LAB:-starter}
    image: workshop-app:${LAB:-starter}
    ports:
      # The first replica receives 8080; a second replica receives 8081.
      - "8080-8081:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      # Set LOG_FORMATTER=json for Lab 1 structured console output.
      Logging__Console__FormatterName: ${LOG_FORMATTER:-simple}
      # Used by the Lab 2 solution; harmless for the native labs.
      OTEL_SERVICE_NAME: workshop-orders
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-5000}
    user: "1654:1654"
    volumes:
      # Required by dotnet-counters: .NET diagnostics IPC sockets live in /tmp.
      - diagnostics:/tmp
    depends_on:
      diagnostics-init:
        condition: service_completed_successfully
      collector:
        condition: service_started
        required: false
    networks: [workshop]

  collector:
    image: otel/opentelemetry-collector:0.111.0
    profiles: [collector]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks: [workshop]

  tools:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: tools
    image: workshop-tools:10.0.745401
    profiles: [tools]
    pid: "service:app"
    user: "1654:1654"
    environment:
      DOTNET_CLI_HOME: /tmp
    volumes:
      - diagnostics:/tmp
    depends_on:
      app:
        condition: service_healthy
    networks: [workshop]

  load:
    image: curlimages/curl:8.11.1
    profiles: [load]
    entrypoint: ["/bin/sh", "/scripts/load.sh", "http://app:8080"]
    volumes:
      - ./scripts/load.sh:/scripts/load.sh:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [workshop]

networks:
  workshop:
    name: observability-workshop

volumes:
  diagnostics: